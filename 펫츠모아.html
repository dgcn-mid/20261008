/* ---------- 상태 ---------- */
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function fromYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function diffDays(a,b){return Math.round((fromYmd(a)-b)/DAY)}
function md(s){var d=fromYmd(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일'}
function seed(){
  var t=today(),logs=[],i;
  var walks=[40,25,55,30,45,20];
  for(i=0;i<6;i++)logs.push({d:ymd(addDays(t,-6+i)),k:'walk',v:walks[i],ex:1});
  logs.push({d:ymd(t),k:'walk',v:20,ex:1});
  return{
    pet:{name:'보리',sp:'dog',breed:'말티즈',age:3,kg:4.2,allergies:['닭고기'],conds:[SKIN]},
    cart:[],subs:[],orders:[],logs:logs,
    vacc:[{n:'종합백신(DHPPL)',next:ymd(addDays(t,12)),mo:12},{n:'켄넬코프',next:ymd(addDays(t,95)),mo:6},{n:'심장사상충 예방',next:ymd(addDays(t,4)),mo:1}],
    stock:{g:600,daily:100},
    addr:{name:'',phone:'',addr:''}
  };
}

/* ---------- 맞춤 추천 로직 ---------- */
function ageBand(p){var a=p.age;if(a<1)return'young';if(p.sp==='dog')return a>=8?'senior':'adult';return a>=10?'senior':'adult'}
function hits(pr){var out=[],i;for(i=0;i<S.pet.allergies.length;i++)if(pr.ing.indexOf(S.pet.allergies[i])>-1)out.push(S.pet.allergies[i]);return out}
function fitsSpecies(pr){return pr.sp==='both'||pr.sp===S.pet.sp}
function matchTags(pr){var t=[],b=ageBand(S.pet);
  if(pr.ages.length<3&&pr.ages.indexOf(b)>-1)t.push(AGE_LABEL[b]+' 맞춤');
  S.pet.conds.forEach(function(c){if(pr.tags.indexOf(c)>-1)t.push(c+' 케어')});return t}
function score(pr){var s=pr.rating,b=ageBand(S.pet);
  if(pr.ages.length<3){s+=pr.ages.indexOf(b)>-1?3:-3}
  S.pet.conds.forEach(function(c){if(pr.tags.indexOf(c)>-1)s+=2});return s}
function pool(){return PRODUCTS.filter(fitsSpecies)}
function safePool(){return pool().filter(function(p){return !hits(p).length})}
function recs(){return safePool().sort(function(a,b){return score(b)-score(a)})}
function unitPrice(pr,sub){return sub?Math.round(pr.price*0.9/10)*10:pr.price}
function reviewsFor(pr){
  var src=pr.sp==='cat'?CAT_REV:pr.sp==='dog'?DOG_REV:DOG_REV.slice(0,3).concat(CAT_REV.slice(0,3)),out=[],i;
  for(i=0;i<5;i++)out.push(src[(pr.id+i*2)%src.length]);
  var uniq=[];out.forEach(function(r){if(uniq.indexOf(r)<0)uniq.push(r)});
  return uniq.map(function(r){var m=[];
    if(r.b===S.pet.breed)m.push('같은 품종');
    if(Math.abs(r.a-S.pet.age)<=1)m.push('비슷한 나이');
    r.c.forEach(function(c){if(S.pet.conds.indexOf(c)>-1)m.push('같은 고민 · '+c)});
    return{r:r,m:m,s:m.length}}).sort(function(a,b){return b.s-a.s});
}

/* ---------- 케어 계산 ---------- */
function daysLeft(){return S.stock.daily>0?Math.floor(S.stock.g/S.stock.daily):99}
function sumLog(d,k){var s=0;S.logs.forEach(function(l){if(l.d===d&&l.k===k)s+=l.v});return s}

/* ---------- 렌더: 공통 ---------- */
function pcard(pr){
  var h=hits(pr),m=matchTags(pr);
  var tl='';
  if(h.length)tl+='<span class="chip warn">'+esc(h[0])+' 포함</span>';
  else if(m.length)tl+='<span class="chip acc">맞춤</span>';
  if(pr.sub)tl+='<span class="chip sun">구독 10%</span>';
  return '<button class="pcard" data-act="open" data-id="'+pr.id+'" data-cat="'+pr.cat+'">'
   +'<div class="tile">'+svg(ICONS[pr.cat])+'<div class="tl">'+tl+'</div></div>'
   +'<span class="br">'+esc(pr.brand)+'</span><span class="nm">'+esc(pr.name)+'</span>'
   +'<span class="price">'+won(pr.price)+'</span>'
   +'<span class="rate">★ '+pr.rating.toFixed(1)+' · 후기 '+pr.n.toLocaleString('ko-KR')+'</span></button>';
}
function petCard(){var p=S.pet;
  return '<div class="card pet"><div class="avatar">'+esc(p.name.charAt(0))+'</div>'
   +'<div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b> <span class="muted">'+(p.sp==='dog'?'강아지':'고양이')+' · '+esc(p.breed)+' · '+p.age+'살 · '+p.kg+'kg</span>'
   +'<div class="chips" style="margin-top:6px">'
   +(p.allergies.length?p.allergies.map(function(a){return '<span class="chip warn">'+esc(a)+' 제외</span>'}).join(''):'<span class="chip">알레르기 없음</span>')
   +p.conds.map(function(c){return '<span class="chip acc">'+esc(c)+'</span>'}).join('')+'</div></div>'
   +'<button class="btn ghost sm" data-act="profile">수정</button></div>';
}

 ['subs','구독','<path d="M20 12a8 8 0 1 1-2.5-5.800"/><path d="M20 4v4h-4"/>'],
 ['my','MY','<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(function(t){return '<button data-act="tab" data-t="'+t[0]+'"'+(UI.tab===t[0]?' aria-current="page"':'')+'>'+svg(t[2])+t[1]+'</button>'}).join('')}
function render(keepScroll){
  var m=$('#main'),y=m.scrollTop;
  var v={home:viewHome,shop:viewShop,care:viewCare,subs:viewSubs,my:viewMy}[UI.tab];
  m.innerHTML=v();renderTabs();
  if(keepScroll)m.scrollTop=y;
  var n=0;S.cart.forEach(function(c){n+=c.qty});
  var b=$('#cartN');b.hidden=!n;b.textContent=n;
}

/* ---------- 시트 ---------- */
function cartTotals(){var sub=0,i;
  for(i=0;i<S.cart.length;i++){var c=S.cart[i],pr=byId(c.pid);sub+=unitPrice(pr,c.sub)*c.qty}
  var ship=(sub===0||sub>=30000)?0:3000;return{sub:sub,ship:ship,total:sub+ship}}
function sheetHead(title,back){return '<header><button class="icon-btn" data-act="close" aria-label="닫기">'+svg('<path d="M15 5l-7 7 7 7"/>')+'</button><h2>'+title+'</h2></header>'}
function sheetProduct(){
  var pr=byId(UI.pid),h=hits(pr),m=matchTags(pr),subOn=UI.opt==='sub'&&pr.sub;
  var price=unitPrice(pr,subOn);
  var rv=reviewsFor(pr);
  return sheetHead('상품 상세')
  +'<div class="body">'
  +'<div class="tile" data-cat="'+pr.cat+'" style="aspect-ratio:16/10">'+svg(ICONS[pr.cat])+'</div>'
  +'<div class="sec"><span class="note">'+esc(pr.brand)+'</span><h2 style="font-size:19px">'+esc(pr.name)+'</h2>'
  +'<div class="row"><span class="price" style="font-size:20px">'+won(pr.price)+'</span><span class="rate">★ '+pr.rating.toFixed(1)+' · 후기 '+pr.n.toLocaleString('ko-KR')+'</span></div>'
  +'<div class="chips">'+(h.length?h.map(function(x){return '<span class="chip warn">'+esc(S.pet.name)+'의 알레르기 성분 '+esc(x)+' 포함</span>'}).join(''):'<span class="chip acc">'+esc(S.pet.name)+'에게 안전한 성분</span>')+m.map(function(x){return '<span class="chip acc">'+esc(x)+'</span>'}).join('')+'</div>'
  +'<p style="margin:0">'+esc(pr.desc)+'</p></div>'
  +'<div class="sec"><span class="lbl">원재료</span><div class="chips">'+pr.ing.map(function(x){return '<span class="chip'+(S.pet.allergies.indexOf(x)>-1?' warn':'')+'">'+esc(x)+'</span>'}).join('')+'</div></div>'
  +'<div class="sec"><span class="lbl">구매 방법</span>'
  +'<button class="opt" data-act="opt" data-o="once" aria-pressed="'+!subOn+'"><span class="dot"></span><span><b>한 번만 구매</b><br><span class="note">'+won(pr.price)+'</span></span></button>'
  +(pr.sub?'<button class="opt" data-act="opt" data-o="sub" aria-pressed="'+subOn+'"><span class="dot"></span><span style="flex:1"><b>정기구독 <span class="chip sun">10% 할인</span></b><br><span class="note">'+won(unitPrice(pr,true))+' · 자동 결제, 언제든 해지</span></span></button>'
   +(subOn?'<div class="row" style="padding-left:4px"><span class="note">배송 주기</span><div class="chips">'+WEEKS.map(function(w){return '<button class="chip toggle" data-act="weeks" data-w="'+w+'" aria-pressed="'+(UI.weeks===w)+'">'+w+'주마다</button>'}).join('')+'</div></div>':''):'<span class="note">이 상품은 정기구독을 지원하지 않아요.</span>')+'</div>'
  +'<div class="sec"><div class="sec-h"><h2>'+esc(S.pet.name)+'와 비슷한 아이 후기</h2><small>같은 품종·나이·고민 순</small></div>'+rv.map(reviewHtml).join('')+'<span class="note">후기는 예시 데이터입니다.</span></div>'
  +'</div>'
  +'<footer><div class="qty"><button data-act="q" data-d="-1" aria-label="수량 줄이기">−</button><span>'+UI.qty+'</span><button data-act="q" data-d="1" aria-label="수량 늘리기">+</button></div>'
  +'<button class="btn ghost" style="flex:1" data-act="add">담기 · '+won(price*UI.qty)+'</button><button class="btn" style="flex:1" data-act="buy">바로 구매</button></footer>';
}
function sheetCart(){
  var t=cartTotals();
  var lines=S.cart.map(function(c,i){var pr=byId(c.pid);return '<div class="card line"><div class="tile" data-cat="'+pr.cat+'">'+svg(ICONS[pr.cat])+'</div><div class="info"><span class="nm" style="font-weight:500">'+esc(pr.name)+'</span>'
   +(c.sub?'<span class="chip sun" style="align-self:flex-start">정기구독 '+c.weeks+'주마다</span>':'')
   +(hits(pr).length?'<span class="chip warn" style="align-self:flex-start">'+esc(hits(pr).join(', '))+' 포함</span>':'')
   +'<div class="row"><div class="qty"><button data-act="cq" data-i="'+i+'" data-d="-1" aria-label="수량 줄이기">−</button><span>'+c.qty+'</span><button data-act="cq" data-i="'+i+'" data-d="1" aria-label="수량 늘리기">+</button></div><span class="price">'+won(unitPrice(pr,c.sub)*c.qty)+'</span></div></div>'
   +'<button class="icon-btn" data-act="crm" data-i="'+i+'" aria-label="삭제">'+svg('<path d="M6 6l12 12M18 6L6 18"/>')+'</button></div>'}).join('');
  return sheetHead('장바구니')+'<div class="body">'+(S.cart.length?lines+'<div class="card sum"><div class="row"><span>상품 금액</span><span>'+won(t.sub)+'</span></div><div class="row"><span>배송비</span><span>'+(t.ship?won(t.ship):'무료')+'</span></div>'+(t.ship?'<span class="note">'+won(30000-t.sub)+' 더 담으면 배송비 무료</span>':'')+'<div class="row tot"><span>결제 예정</span><span>'+won(t.total)+'</span></div></div>':'<div class="empty"><b>장바구니가 비어 있어요</b><span>'+esc(S.pet.name)+'에게 맞는 상품을 담아보세요.</span><button class="btn" data-act="close-tab" data-t="shop">쇼핑하러 가기</button></div>')+'</div>'
  +(S.cart.length?'<footer><button class="btn block" data-act="checkout">'+won(t.total)+' 주문하기</button></footer>':'');
}
function sheetCheckout(){
  var t=cartTotals(),a=S.addr;
  return sheetHead('주문하기')+'<div class="body">'
  +'<div class="sec"><h2>배송지</h2>'
  +'<div class="field"><label for="a-name">받는 분</label><input id="a-name" autocomplete="name" value="'+esc(a.name)+'"></div>'
  +'<div class="field"><label for="a-phone">연락처</label><input id="a-phone" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" value="'+esc(a.phone)+'"></div>'
  +'<div class="field"><label for="a-addr">주소</label><input id="a-addr" autocomplete="street-address" value="'+esc(a.addr)+'"></div></div>'
  +'<div class="field"><label for="a-pay">결제 수단</label><select id="a-pay"><option>간편결제</option><option>신용·체크카드</option><option>계좌이체</option></select></div>'
  +'<div class="card sum"><div class="row"><span>상품 금액</span><span>'+won(t.sub)+'</span></div><div class="row"><span>배송비</span><span>'+(t.ship?won(t.ship):'무료')+'</span></div><div class="row tot"><span>총 결제 금액</span><span>'+won(t.total)+'</span></div></div>'
  +(S.cart.some(function(c){return c.sub})?'<span class="note">정기구독 상품은 선택한 주기마다 같은 수단으로 자동 결제됩니다. 구독 탭에서 언제든 해지할 수 있어요.</span>':'')
  +'<span class="note">시연용 화면입니다. 실제 결제는 진행되지 않으며 입력한 정보는 이 기기에만 저장됩니다.</span>'
  +'<div class="err" id="err" role="alert">'+esc(UI.err)+'</div></div>'
  +'<footer><button class="btn block" data-act="pay">'+won(t.total)+' 결제하기</button></footer>';
}
function sheetDone(){
  return sheetHead('주문 완료')+'<div class="body"><div class="empty"><div class="avatar">✓</div><b style="font-size:18px;color:var(--ink)">주문이 접수됐어요</b><span>'+(S.subs.length?'정기구독 상품은 구독 탭에서 다음 배송일을 확인할 수 있어요.':'주문 내역은 MY에서 볼 수 있어요.')+'</span><button class="btn" data-act="close-tab" data-t="home">홈으로</button></div></div>';
}
var DRAFT=null;
function sheetProfile(){
  var p=DRAFT;
  return sheetHead('반려동물 프로필')+'<div class="body">'
  +'<div class="field"><label for="p-name">이름</label><input id="p-name" value="'+esc(p.name)+'"></div>'
  +'<div class="sec"><span class="lbl">종류</span><div class="seg"><button class="chip toggle" data-act="dsp" data-s="dog" aria-pressed="'+(p.sp==='dog')+'">강아지</button><button class="chip toggle" data-act="dsp" data-s="cat" aria-pressed="'+(p.sp==='cat')+'">고양이</button></div></div>'
  +'<div class="field"><label for="p-breed">품종</label><input id="p-breed" value="'+esc(p.breed)+'" placeholder="예: 말티즈, 코리안숏헤어"></div>'
  +'<div class="seg"><div class="field"><label for="p-age">나이(살)</label><input id="p-age" type="number" min="0" max="25" step="1" inputmode="numeric" value="'+p.age+'"></div><div class="field"><label for="p-kg">몸무게(kg)</label><input id="p-kg" type="number" min="0.3" max="80" step="0.1" inputmode="decimal" value="'+p.kg+'"></div></div>'
  +'<div class="sec"><span class="lbl">알레르기 성분 (선택한 성분이 든 상품은 추천에서 제외돼요)</span><div class="chips" id="d-al">'+ALLERGENS.map(function(a){return '<button class="chip toggle" data-act="dtog" data-g="allergies" data-v="'+a+'" aria-pressed="'+(p.allergies.indexOf(a)>-1)+'">'+a+'</button>'}).join('')+'</div></div>'
  +'<div class="sec"><span class="lbl">신경 쓰는 건강 고민</span><div class="chips" id="d-co">'+CONDS.map(function(a){return '<button class="chip toggle" data-act="dtog" data-g="conds" data-v="'+a+'" aria-pressed="'+(p.conds.indexOf(a)>-1)+'">'+a+'</button>'}).join('')+'</div></div>'
  +'</div><footer><button class="btn block" data-act="psave">저장하고 추천 새로고침</button></footer>';
}
function openSheet(type){
  UI.sheet=type;
  var sh=$('#sheet'),prev=$('.body',sh),y=prev&&sh.classList.contains('open')?prev.scrollTop:0;
  sh.innerHTML={product:sheetProduct,cart:sheetCart,checkout:sheetCheckout,done:sheetDone,profile:sheetProfile}[type]();
  sh.classList.add('open');
  var b=$('.body',sh);if(b)b.scrollTop=y;
  if(!sh.classList.contains('was'))sh.classList.add('was');
}
function closeSheet(){UI.sheet=null;$('#sheet').classList.remove('open');render(true)}

/* ---------- 액션 ---------- */
function addToCart(){
  var pr=byId(UI.pid),sub=UI.opt==='sub'&&pr.sub,i;
  for(i=0;i<S.cart.length;i++){var c=S.cart[i];if(c.pid===pr.id&&!!c.sub===!!sub&&(!sub||c.weeks===UI.weeks)){c.qty+=UI.qty;save();return}}
  S.cart.push({pid:pr.id,qty:UI.qty,sub:sub,weeks:sub?UI.weeks:0});save();
}
function readAddr(){S.addr={name:$('#a-name').value.trim(),phone:$('#a-phone').value.trim(),addr:$('#a-addr').value.trim()}}
var A={
 tab:function(e){UI.tab=e.dataset.t;render();$('#main').scrollTop=0},
 'close-tab':function(e){UI.tab=e.dataset.t;closeSheet();$('#main').scrollTop=0},
 cart:function(){openSheet('cart')},
 close:function(){closeSheet()},
 open:function(e){UI.pid=+e.dataset.id;UI.opt='once';UI.weeks=4;UI.qty=1;openSheet('product')},
 'open-sub':function(e){UI.pid=+e.dataset.id;UI.opt='sub';UI.weeks=4;UI.qty=1;openSheet('product')},
 opt:function(e){UI.opt=e.dataset.o;openSheet('product')},
 weeks:function(e){UI.weeks=+e.dataset.w;openSheet('product')},
 q:function(e){UI.qty=Math.max(1,Math.min(20,UI.qty+ +e.dataset.d));openSheet('product')},
 add:function(){var h=hits(byId(UI.pid));addToCart();closeSheet();toast(h.length?'담았어요. '+h.join(', ')+' 성분이 들어 있어요':'장바구니에 담았어요');render(true)},
 buy:function(){addToCart();UI.err='';openSheet('checkout')},
 cq:function(e){var c=S.cart[+e.dataset.i];c.qty=Math.max(1,Math.min(20,c.qty+ +e.dataset.d));save();openSheet('cart')},
 crm:function(e){S.cart.splice(+e.dataset.i,1);save();openSheet('cart')},
 checkout:function(){UI.err='';openSheet('checkout')},
 pay:function(){
  readAddr();var pay=$('#a-pay').value;
  if(!S.addr.name||!S.addr.phone||!S.addr.addr){UI.err='받는 분, 연락처, 주소를 모두 입력해 주세요.';$('#err').textContent=UI.err;save();return}
  var t=cartTotals(),td=today(),lines=[];
  S.cart.forEach(function(c){var pr=byId(c.pid);
    lines.push({name:pr.name,qty:c.qty,p:unitPrice(pr,c.sub),sub:c.sub});
    if(c.sub)S.subs.push({id:Date.now()+'-'+pr.id+'-'+c.weeks,pid:pr.id,qty:c.qty,weeks:c.weeks,next:ymd(addDays(td,c.weeks*7))});
  });
  S.orders.push({d:ymd(td),lines:lines,ship:t.ship,total:t.total,pay:pay});
  S.cart=[];save();openSheet('done');
 },
 cat:function(e){UI.cat=e.dataset.c;$('#cats').innerHTML=catChips();$('#list').innerHTML=listHtml()},
 safe:function(){UI.safe=!UI.safe;$('#safeSw').setAttribute('aria-checked',UI.safe);$('#list').innerHTML=listHtml()},
 log:function(e){S.logs.push({d:ymd(today()),k:e.dataset.k,v:+e.dataset.v});save();render(true);toast('산책 '+e.dataset.v+'분을 기록했어요')},
 feed:function(e){var v=+e.dataset.v;S.logs.push({d:ymd(today()),k:'feed',v:v});S.stock.g=Math.max(0,S.stock.g-v);save();render(true);toast('급여 '+v+'g을 기록했어요')},
 restock:function(){S.stock.g+=2000;save();render(true);toast('남은 사료에 2kg을 더했어요')},
 vdone:function(e){S.vacc.forEach(function(v){if(v.n===e.dataset.n){var d=addDays(today(),0);d.setMonth(d.getMonth()+v.mo);v.next=ymd(d)}});save();render(true);toast('접종을 완료 처리했어요. 다음 일정을 갱신했어요')},
 skip:function(e){S.subs.forEach(function(s){if(s.id===e.dataset.id)s.next=ymd(addDays(fromYmd(s.next),s.weeks*7))});save();render(true);toast('다음 배송을 한 번 건너뛰어요')},
 cancel:function(e){S.subs=S.subs.filter(function(s){return s.id!==e.dataset.id});save();render(true);toast('정기구독을 해지했어요')},
 profile:function(){DRAFT=JSON.parse(JSON.stringify(S.pet));openSheet('profile')},
 dsp:function(e){DRAFT.sp=e.dataset.s;[].forEach.call(e.parentNode.children,function(b){b.setAttribute('aria-pressed',b===e)})},
 dtog:function(e){var g=DRAFT[e.dataset.g],v=e.dataset.v,i=g.indexOf(v);if(i>-1)g.splice(i,1);else g.push(v);e.setAttribute('aria-pressed',i<0)},
 psave:function(){
  var n=$('#p-name').value.trim()||'우리 아이';
  DRAFT.name=n;DRAFT.breed=$('#p-breed').value.trim()||'믹스';
  DRAFT.age=Math.max(0,Math.min(25,parseInt($('#p-age').value,10)||0));DRAFT.kg=Math.max(0.3,parseFloat($('#p-kg').value)||1);
  S.pet=DRAFT;save();closeSheet();toast(n+'에게 맞는 추천으로 바꿨어요');
 }
};
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var f=A[el.dataset.act];if(f)f(el);
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){UI.q=ev.target.value;$('#list').innerHTML=listHtml()}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&UI.sheet)closeSheet()});
render();
})();
</script>

</body></html>
